[package]
name = "soundpad-improved"
version = "0.3.0"
edition = "2024"
description = "Soundboard polyphonique : plusieurs sons à la fois, volume réglable en direct, import de la bibliothèque Soundpad."
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
symphonia-adapter-libopus = "0.3"
rubato = "5"
nnnoiseless = "0.5"
rfd = "0.17"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
