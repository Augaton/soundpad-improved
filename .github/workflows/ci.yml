name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # <major>.<minor> of Cargo.toml, then the CI run number: 0.2.12, 0.2.13...
      # The exe knows it, to tell when a newer release is out.
      - name: Version
        id: version
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+)').Matches[0].Groups[1].Value
          "version=$base.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      # The microphone filter first: the app embeds the DLL when it is built.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: g++ de MSYS2 dans le PATH
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Compilation du filtre micro
        run: native\build.cmd

      - name: Test du filtre micro de bout en bout
        run: native\bin\test_apo.exe native\bin

      - uses: Swatinem/rust-cache@v2

      - name: Mise en forme
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests Rust
        run: cargo test

      - name: Exe
        env:
          SPI_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: target/release/bruitage.exe

  # Every green push on main publishes the exe as a GitHub Release, under the build's version.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: exe

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.build.outputs.version }}"
          Move-Item bruitage.exe "Bruitage-$v.exe"
          gh release create "v$v" "Bruitage-$v.exe" --target "${{ github.sha }}" --title "Bruitage $v" --generate-notes
