name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The microphone filter first: the app embeds the DLL when it is built.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: g++ de MSYS2 dans le PATH
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Compilation du filtre micro
        run: native\build.cmd

      - name: Test du filtre micro de bout en bout
        run: native\bin\test_apo.exe native\bin

      - uses: Swatinem/rust-cache@v2

      - name: Tests Rust
        run: cargo test

      - name: Exe
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: target/release/soundpad-improved.exe

  # Every green push on main publishes the exe as a GitHub Release, numbered <major>.<minor>
  # of Cargo.toml, then the CI run number: 0.2.12, 0.2.13...
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: exe

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+)').Matches[0].Groups[1].Value
          $v = "$base.${{ github.run_number }}"
          Move-Item soundpad-improved.exe "Soundpad-Improved-$v.exe"
          gh release create "v$v" "Soundpad-Improved-$v.exe" --target "${{ github.sha }}" --title "Soundpad Improved $v" --generate-notes
