name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pure logic only: no dependency to install (Electron is not needed).
      - name: Tests JS
        run: npm test

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: g++ de MSYS2 dans le PATH
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Compilation du filtre micro
        run: npm run build:native

      - name: Test du filtre micro de bout en bout
        run: npm run test:native

      - uses: actions/upload-artifact@v4
        with:
          name: filtre-micro
          path: |
            native/bin/SoundpadImprovedApo.dll
            native/bin/spi-feed.exe
