name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pure logic only: no dependency to install (Electron is not needed).
      - name: Tests JS
        run: npm test

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: g++ de MSYS2 dans le PATH
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Compilation du filtre micro
        run: npm run build:native

      - name: Test du filtre micro de bout en bout
        run: npm run test:native

      - uses: actions/upload-artifact@v4
        with:
          name: filtre-micro
          path: |
            native/bin/SoundpadImprovedApo.dll
            native/bin/spi-feed.exe

  # Every green push on main publishes the portable exe as a GitHub Release, numbered
  # <major>.<minor> of package.json, then the CI run number: 0.1.12, 0.1.13...
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder fetches the Electron it packages by itself.
      - name: Dépendances
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The filter built and tested by the test job.
      - uses: actions/download-artifact@v4
        with:
          name: filtre-micro
          path: native/bin

      - name: Numéro de version
        id: version
        run: |
          $base = node -p "require('./package.json').version.split('.').slice(0, 2).join('.')"
          "version=$base.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Exe portable
        run: npx electron-builder --win portable --publish never "-c.extraMetadata.version=${{ steps.version.outputs.version }}"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" "dist/Soundpad-Improved-$v.exe" --target "${{ github.sha }}" --title "Soundpad Improved $v" --generate-notes
