<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">Schéma de la fenêtre de Bruitage</title>
  <desc id="d">En haut, la recherche, le tri et les boutons d'ajout, de réglages et Tout arrêter. À gauche, les catégories. Au milieu, la grille des sons : un son qui joue, avec sa barre de progression, des raccourcis, un favori, un son sélectionné et un fichier introuvable. À droite, les sons en cours avec leurs curseurs, puis les volumes et le niveau envoyé aux autres.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #e6e8eb; font-size: 13px; }
    .t2 { fill: #b0b6bd; }
    .t3 { fill: #8d959e; font-size: 12px; }
    .small { font-size: 11px; }
    .bold { font-weight: 600; }
    .head { font-size: 16px; font-weight: 600; }
    .danger { fill: #e2766a; }
    .accent { fill: #e0a046; }
    .pad { fill: #22262b; }
    .chip { fill: none; stroke: #464d55; }
    .num circle { fill: #e0a046; }
    .num text { fill: #1c1407; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .grow { transform-box: fill-box; transform-origin: left; animation: grow 3.2s linear infinite; }
    .level { transform-box: fill-box; transform-origin: left; animation: level 1.1s ease-in-out infinite alternate; }
    @keyframes grow { from { transform: scaleX(0.05); } to { transform: scaleX(1); } }
    @keyframes level { 0% { transform: scaleX(0.35); } 40% { transform: scaleX(0.8); } 70% { transform: scaleX(0.55); } 100% { transform: scaleX(0.9); } }
    @media (prefers-reduced-motion: reduce) { .grow, .level { animation: none; } }
  </style>

